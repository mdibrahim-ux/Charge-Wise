project_id = "chargewise"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[studio]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://charge-wise-omega.vercel.app"]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.sync-bengaluru-stations]
verify_jwt = true
